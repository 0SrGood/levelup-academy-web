name: Prévias dos materiais
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: materiais-preview
  cancel-in-progress: false
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp@0.35.4
      - run: node tools/material-share.mjs .
      - run: |
          git config user.name "Level Up"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materiais
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza prévias dos materiais"
            git pull --rebase origin main
            git push
          fi
