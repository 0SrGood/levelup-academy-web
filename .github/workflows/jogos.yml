name: Páginas de compartilhar jogos
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jogos
  cancel-in-progress: false
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/jogos-share.mjs .
      - run: |
          git config user.name "Level Up"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos
          git diff --cached --quiet || (git commit -m "Atualiza as páginas de compartilhar jogos" && git push)
